<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-label="Mario Martínez: Jr. cybersecurity &amp; data · I learn by breaking things first">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}.l{animation:in .5s ease-out backwards}@keyframes in{from{opacity:0;transform:translateY(4px)}}.c{animation:blink 1s steps(1) 6}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion:reduce){.l,.c{animation:none}}</style>
<rect width="900" height="390" rx="10" fill="#0a1020"/>
<text x="40" y="62" font-size="34" font-weight="700" fill="#c9d4e5">Mario Martínez</text>
<text x="40" y="90" font-size="15" fill="#7f8da6">Jr. cybersecurity &amp; data · I learn by breaking things first</text>
<line x1="40" y1="108" x2="860" y2="108" stroke="#27324a"/>
<g class="l" style="animation-delay:0.4s"><text x="40" y="140" font-size="15" fill="#ff4fd8">$</text><text x="60" y="140" font-size="15" fill="#c9d4e5">nmap -sV --open mario</text></g>
<g class="l" style="animation-delay:0.9s"><text x="40" y="168" font-size="15" fill="#7f8da6">Host is up. Open to work: trainee / junior roles</text></g>
<g class="l" style="animation-delay:1.4s"><text x="40" y="206" font-size="13" fill="#7f8da6">PORT</text><text x="150" y="206" font-size="13" fill="#7f8da6">STATE</text><text x="235" y="206" font-size="13" fill="#7f8da6">SERVICE</text><text x="360" y="206" font-size="13" fill="#7f8da6">VERSION</text></g>
<g class="l" style="animation-delay:1.75s"><text x="40" y="238" font-size="15" fill="#c9d4e5">22/tcp</text><text x="150" y="238" font-size="15" fill="#35e0f0">open</text><text x="235" y="238" font-size="15" fill="#c9d4e5">cloud</text><text x="360" y="238" font-size="15" fill="#7f8da6">AWS · Docker · IAM least-privilege</text></g>
<g class="l" style="animation-delay:2.10s"><text x="40" y="266" font-size="15" fill="#c9d4e5">80/tcp</text><text x="150" y="266" font-size="15" fill="#35e0f0">open</text><text x="235" y="266" font-size="15" fill="#c9d4e5">data</text><text x="360" y="266" font-size="15" fill="#7f8da6">Python · Pandas · SQL · scikit-learn</text></g>
<g class="l" style="animation-delay:2.45s"><text x="40" y="294" font-size="15" fill="#c9d4e5">443/tcp</text><text x="150" y="294" font-size="15" fill="#35e0f0">open</text><text x="235" y="294" font-size="15" fill="#c9d4e5">offensive</text><text x="360" y="294" font-size="15" fill="#7f8da6">Nmap · Metasploit · Hack The Box</text></g>
<g class="l" style="animation-delay:2.80s"><text x="40" y="322" font-size="15" fill="#c9d4e5">8080/tcp</text><text x="150" y="322" font-size="15" fill="#35e0f0">open</text><text x="235" y="322" font-size="15" fill="#c9d4e5">learning</text><text x="360" y="322" font-size="15" fill="#7f8da6">always on</text></g>
<g class="l" style="animation-delay:3.20s"><text x="40" y="362" font-size="15" fill="#ff4fd8">$</text><rect class="c" style="animation-delay:3.70s" x="58" y="349" width="9" height="17" fill="#ff4fd8"/></g>
</svg>
