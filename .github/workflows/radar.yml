name: Refresh charts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/skills.json"
      - "scripts/radar.py"
      - "scripts/banner.py"

permissions:
  contents: write

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Radar
        run: python scripts/radar.py --data assets/skills.json -o assets/radar

      - name: Banner
        run: python scripts/banner.py -o assets/banner

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh charts"
          git push

